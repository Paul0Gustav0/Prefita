name: Sondar fontes de dados (temporário)
on:
  push:
    branches: ["claude/**"]
    paths: ["sondagem/**", ".github/workflows/sondar.yml"]
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python sondagem/sondar.py

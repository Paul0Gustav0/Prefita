name: Coletar dados e publicar painel

on:
  schedule:
    - cron: "15 9 * * *"   # todo dia às 06:15 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "coletor/**"
      - ".github/workflows/coletar.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (criptografia da área reservada)
        run: pip install cryptography==44.0.0

      # Cadastros da Receita (QSA) consultados nos dias anteriores. Ficam no cache do Actions,
      # fora do repositório público, para não refazer ~1.500 consultas todo dia.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/cnpj
          key: cnpj-${{ github.run_id }}
          restore-keys: cnpj-

      - name: Coletar dados
        env:
          PREFITA_SENHA: ${{ secrets.PREFITA_SENHA }}
        run: python coletor/coletar.py

      # Salva o cache mesmo se um passo seguinte falhar, para não repetir as consultas à Receita.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/cnpj
          key: cnpj-${{ github.run_id }}

      - name: Salvar dados no repositório
        run: |
          git config user.name "prefita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados site/data
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Dados atualizados em $(date -u +%Y-%m-%d)"
            # Se alguém mesclou algo no main durante a coleta, junta e tenta de novo.
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase -X theirs origin main
              sleep $((i * 5))
            done
            git log origin/main -1 --format=%H | grep -q "$(git rev-parse HEAD)" || { echo "não consegui enviar"; exit 1; }
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
